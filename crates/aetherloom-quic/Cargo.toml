[package]
name = "aetherloom-quic"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Native QUIC transport adapter for Aetherloom dedicated match servers"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
aetherloom-protocol = { path = "../aetherloom-protocol", features = ["std"] }
aetherloom-server = { path = "../aetherloom-server" }
bytes = "=1.10.1"
quinn = { version = "=0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.31", default-features = false, features = ["ring", "std"] }
tokio = { version = "=1.47.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
rcgen = "=0.13.2"

