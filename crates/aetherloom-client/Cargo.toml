[package]
name = "aetherloom-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Portable client, presentation, input, transport, and platform boundaries for Aetherloom"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
std = ["aetherloom-core/std", "aetherloom-protocol/std"]

[dependencies]
aetherloom-core = { path = "../aetherloom-core" }
aetherloom-protocol = { path = "../aetherloom-protocol" }
