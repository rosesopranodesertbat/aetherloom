[package]
name    = "aetherloom-sim"
version = "1.0.0"
edition = "2021"
description = "Aetherloom simulation core — freestanding wasm32, zero imports."
license = "MIT"

[workspace]
members = [
    ".",
    "apps/aetherloom-dedicated",
    "crates/aetherloom-client",
    "crates/aetherloom-core",
    "crates/aetherloom-protocol",
    "crates/aetherloom-quic",
    "crates/aetherloom-server",
]
default-members = ["."]
resolver = "2"

[lib]
name       = "sim"
crate-type = ["cdylib", "rlib"]
path       = "src/lib.rs"

# Transcendentals in pure Rust. core has no sin/cos/atan2, and pulling in std
# would drag a runtime we have no use for — the module must stay importless.
[dependencies]
libm = { version = "0.2", default-features = false }
# Safe global state without an allocator. wasm32-unknown-unknown is
# single-threaded so the lock never contends; it exists so the world can be
# reached from a `static` without a single unsafe block.
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }

[dev-dependencies]
aetherloom-protocol = { path = "crates/aetherloom-protocol", features = ["std"] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
